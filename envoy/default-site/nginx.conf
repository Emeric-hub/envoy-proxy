server_tokens off;

server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    # Any path that isn't index.html itself (there's nothing else here by
    # design — this is the catch-all for domains not in routes.csv) falls
    # through to the same branded page rather than nginx's own default 404,
    # which embeds its version string directly in the body regardless of
    # server_tokens. "=404" keeps the real status code; only the body changes.
    error_page 404 =404 /index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
