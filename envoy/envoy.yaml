# Everything that used to be hand-written here as static_resources
# (listeners, routes, clusters) is now generated dynamically by
# envoy-control-plane from routes.csv + ssl/, and pushed over gRPC (ADS) —
# see envoy-control-plane/main.go. This file only has what Envoy needs to
# find that control plane; it never changes when routes.csv does.
node:
  id: envoy-node-1
  cluster: envoy-demo-cluster

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

dynamic_resources:
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    grpc_services:
      - envoy_grpc:
          cluster_name: xds_cluster
  cds_config:
    resource_api_version: V3
    ads: {}
  lds_config:
    resource_api_version: V3
    ads: {}

static_resources:
  clusters:
    - name: xds_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: xds_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: envoy-control-plane, port_value: 18000 }
