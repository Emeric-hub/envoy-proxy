<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Request Blocked</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 0;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1d24; border: 1px solid #2a2f3a; border-radius: 12px; padding: 2.5rem 3rem; max-width: 480px; text-align: center; }
  .code { font-size: 3rem; font-weight: 700; color: #f87171; margin: 0; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0.5rem 0 1rem; }
  p { color: #9aa0aa; font-size: 0.9rem; line-height: 1.5; margin: 0 0 0.5rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="code">403</div>
    <h1>Request Blocked</h1>
    <p>This request was flagged as high-risk and blocked before reaching the application.</p>
    <p>If you believe this is a mistake, contact the site operator.</p>
  </div>
</body>
</html>
