# Detects requests for common CMS/framework admin-panel and
# management-endpoint paths that CRS core does NOT cover — verified
# directly against the vendored ruleset before writing this: CRS's own
# rule 930130 ("Restricted File Access Attempt", REQUEST-930-APPLICATION-ATTACK-LFI.conf)
# already checks REQUEST_FILENAME against a 765-entry list
# (restricted-files.data) covering source-code/credential/VCS-metadata
# exposure (.env, .git/, .aws/, .htpasswd, wp-config.*, ...) — that
# category is NOT duplicated here. What 930130 does not cover is
# recon for the *existence* of a specific CMS/admin panel or framework
# management endpoint, a different concern (probing what software is
# running, not trying to read a sensitive file) — that's what this rule
# adds.
#
# IMPORTANT — verify before relying on this: these paths are only a safe
# signal if your real backend never legitimately serves them. This
# demo's echo backend never does. A real deployment that actually runs
# WordPress, phpMyAdmin, or exposes Spring Boot Actuator/Apache
# mod_status deliberately MUST NOT enable this rule for those routes
# without adjusting the path list first — same caveat as any
# unambiguous-by-assumption signal, the burden is on whoever configures
# this list, not on the rule itself.
#
# Same severity/tag convention as CRS core rules: severity CRITICAL is
# capped at weight 5 by coraza-service's own scoring (severityWeight in
# main.go), so this alone won't cross RISK_THRESHOLD=0.8 for a single
# match (same documented gap as a lone scanner-UA hit — see TODO.md) —
# but a CRITICAL match unconditionally feeds CrowdSec's
# crowdsecurity/modsecurity scenario regardless of this request's own
# combined score (verified live: a single CRITICAL match bans the source
# IP immediately, even when the current request itself isn't blocked),
# so the practical effect is the same IP gets blocked starting on its
# very next request either way.
SecRule REQUEST_FILENAME "@rx ^/(wp-admin|wp-login\.php|phpmyadmin|xmlrpc\.php|server-status|actuator/health)(/|$)" \
    "id:10001,\
    phase:1,\
    block,\
    capture,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,\
    msg:'CMS/framework admin-panel or management-endpoint recon (not covered by CRS core restricted-files.data)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-reputation-scanner',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL'"

# Requests whose Host header is a raw IP literal instead of a real domain
# name — normal browser/API traffic always addresses a domain (that's what
# routes.csv matches on); a request naming the proxy's own IP directly is a
# recon pattern (scanners/mass-probers enumerating IP ranges rather than
# targeting a specific site), not something legitimate clients produce.
#
# This rule can only ever fire for envoy-control-plane's vh_default
# catch-all (see buildRouteConfig in envoy-control-plane/main.go) — every
# real routes.csv domain has its own vhost matched by name, so this never
# touches real traffic. It required an envoy-control-plane change to work
# at all: verified empirically that vh_default's original
# DirectResponseAction (the static "No site configured" page) never
# invokes ext_authz — no scoring-service log entry appeared for a raw-IP
# Host request under the old config — so Coraza never even saw these
# requests before. vh_default now has a dedicated route, matched only when
# :authority looks like an IP literal, that proxies through ext_authz/Coraza
# instead; everything else unmatched still gets the old static page
# unscored.
#
# IPv4 only, with or without an explicit port (":authority" carries the
# port when the client sent one) — deliberately not attempting IPv6
# literals (bracketed "[::1]" form) for this demo; extend the regex if
# that matters for a real deployment.
SecRule REQUEST_HEADERS:Host "@rx ^(\d{1,3}\.){3}\d{1,3}(:\d+)?$" \
    "id:10002,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Request targeting a raw IP address instead of a domain name',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-reputation-scanner',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL'"
