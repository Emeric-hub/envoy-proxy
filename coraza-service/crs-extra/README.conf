# Hand-authored new CRS-style rules — edit/add files here directly, no
# rebuild or restart needed (coraza-service watches this directory and
# hot-reloads the WAF, same mechanism as ../crs-exclusions/).
#
# This is for ADDING new detections that aren't part of upstream CRS. If
# you want to narrow or remove an existing CRS rule instead, that belongs
# in ../crs-exclusions/, not here.
#
# Loaded after CRS's own rules but before crs-exclusions/ — so an exclusion
# can, if it ever needs to, also tune a rule defined here.
#
# Rule ID range: 1-29999 is reserved for this folder. crs-exclusions/ uses
# 30000-59999 for hand-written exclusions and 60000+ for crs-tuner's
# auto-generated ones (see crs-exclusions/crs_exclusion.conf) — anything
# added here must stay under 30000 to avoid colliding with either.
#
# Example:
#
# SecRule REQUEST_HEADERS:User-Agent "@contains internal-healthcheck" \
#     "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"
