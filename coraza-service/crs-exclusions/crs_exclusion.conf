# Local CRS exclusions/exceptions — edit this file directly, no rebuild or
# restart needed (coraza-service watches it and hot-reloads the WAF).
#
# This lives outside coraza-service/crs/ on purpose: that directory is wiped
# and regenerated every time fetch-crs.sh runs, which would silently destroy
# anything added here. This file is Included *after* the CRS rule files (see
# main.go), which is required for SecRuleRemoveById/SecRuleUpdateTargetById/etc
# — they operate on already-registered rule IDs, so they only work once CRS's
# own rules have already been loaded.
#
# Rule ID range: per CRS's own numbering scheme (CONTRIBUTING.md), CRS itself
# uses 900000-999999 and CRS exclusion packages/plugins use 9000000-9999999.
# Anything you add here must use an ID outside both ranges — the conventional
# range for local/site-specific rules is 1-99999.
#
# Examples:
#
# Remove a specific CRS rule entirely for all requests:
#   SecRuleRemoveById 942100
#
# Narrow a rule's scope instead of removing it outright (e.g. stop it from
# inspecting a specific noisy argument):
#   SecRuleUpdateTargetById 941100 "!ARGS:comment_html"
#
# Add your own local rule (must use an ID below 900000):
#   SecRule REQUEST_HEADERS:User-Agent "@contains internal-healthcheck" \
#       "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"
