# Local CRS exclusions/exceptions — edit this file directly, no rebuild or
# restart needed (coraza-service watches this directory and hot-reloads the
# WAF; other .conf files dropped in here are picked up too, e.g.
# auto-<domain>.conf files crs-tuner generates — see below).
#
# This lives outside coraza-service/crs/ on purpose: that directory is wiped
# and regenerated every time CRS is (re)fetched, which would silently
# destroy anything added here. Everything in this directory is Included
# *after* the CRS rule files (see main.go), which is required for
# SecRuleRemoveById/SecRuleUpdateTargetById/ctl:ruleRemoveTargetById/etc —
# they operate on already-registered rule IDs, so they only work once CRS's
# own rules have already been loaded. If you want to ADD a new rule instead
# of narrowing/removing an existing one, that belongs in ../crs-extra/, not
# here.
#
# Rule ID range: per CRS's own numbering scheme (CONTRIBUTING.md), CRS itself
# uses 900000-999999 and CRS exclusion packages/plugins use 9000000-9999999.
# Below that, this project splits the local range three ways so hand-written
# and machine-generated rules can never collide:
#   1-29999      ../crs-extra/       new rules you write by hand
#   30000-59999  this directory      exclusions you write by hand
#   60000+       auto-<domain>.conf  exclusions crs-tuner generates —
#                                    don't hand-edit these; add a manual
#                                    exclusion in this range instead if you
#                                    need to override one
#
# This directory is globbed as a whole (*.conf), not just this one file — so
# a domain-scoped exclusion doesn't have to live in here mixed in with every
# other domain's. For better per-site management, put it in its own
# <domain>.conf next to this file instead, e.g. shop.example.com.conf — see
# that file for a worked example. Keep truly cross-domain exclusions (no
# Host condition, applies everywhere) in this file.
#
# Because the whole directory loads as one ruleset, IDs must stay unique
# across every file in here, not just within one file — not enforced by
# tooling, just coordinate manually (Coraza fails to load on a collision,
# which is your signal something clashed).
#
# Examples:
#
# Remove a specific CRS rule entirely for all requests:
#   SecRuleRemoveById 942100
#
# Narrow a rule's scope instead of removing it outright (e.g. stop it from
# inspecting a specific noisy argument):
#   SecRuleUpdateTargetById 941100 "!ARGS:comment_html"
#
# Add your own local rule (must use an ID between 30000-59999, unique across
# this whole directory):
#   SecRule REQUEST_HEADERS:User-Agent "@contains internal-healthcheck" \
#       "id:30000,phase:1,pass,nolog,ctl:ruleEngine=Off"
