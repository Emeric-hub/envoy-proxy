# Hand-written exclusions scoped to shop.example.com only. Per-site file —
# see crs_exclusion.conf for the ID range and why domain-scoped exclusions
# belong in their own file instead of that shared one.
#
# SecRuleUpdateTargetById/SecRuleRemoveById can't be conditioned on Host —
# they're config-time directives, not per-request ones — so a domain-scoped
# exclusion needs ctl: inside a matching SecRule instead. This is the same
# mechanism crs-tuner's auto-<domain>.conf files use.
#
# Example (commented out — copy/adjust and drop the leading # to activate):
#
# SecRule REQUEST_HEADERS:Host "@streq shop.example.com" \
#     "id:30001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=941100;ARGS:comment_html"
