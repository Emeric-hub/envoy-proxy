services:
  envoy:
    image: envoyproxy/envoy:${ENVOY_VERSION:-v1.39.1}
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/error_pages:/etc/envoy/error_pages:ro
      # No ssl/ mount here: envoy-control-plane reads and embeds cert/key
      # bytes directly into the Listener config it pushes (DataSource_InlineBytes,
      # not a filename reference) — Envoy itself never touches the cert files
      # on disk, so it doesn't need this mount.
    ports:
      - "${ENVOY_HTTP_PORT:-10000}:${ENVOY_HTTP_PORT:-10000}"
      - "${ENVOY_HTTPS_PORT:-10443}:${ENVOY_HTTPS_PORT:-10443}"
      # Same port number as above, UDP: HTTP/3 (QUIC) shares the port with
      # the TCP HTTPS listener — see envoy-control-plane's alt-svc header.
      - "${ENVOY_HTTPS_PORT:-10443}:${ENVOY_HTTPS_PORT:-10443}/udp"
      # Admin API (9901) is intentionally NOT published — envoy.yaml binds it
      # to 127.0.0.1 inside the container (no auth on that API), so reach it
      # with `docker compose exec envoy` rather than opening it to the host.
      #
      # Port 80 for Let's Encrypt's HTTP-01 challenge — not the ACME
      # protocol's port, it's fixed, not configurable on their end.
      # Commented out by default: envoy-control-plane only builds the
      # ACME-challenge listener at all once a routes.csv row has
      # letsencrypt=true (see that repo's buildAcmeChallengeListener), so
      # this is a no-op otherwise. Uncomment when using the "letsencrypt"
      # profile — see claude-shim-style opt-in note on the
      # letsencrypt-sidecar service below.
      # - "${ACME_HTTP01_PORT:-80}:${ACME_HTTP01_PORT:-80}"
    depends_on:
      - envoy-control-plane
      - scoring-service
      - backend

  envoy-control-plane:
    build: ./envoy-control-plane
    environment:
      - ENVOY_HTTP_PORT=${ENVOY_HTTP_PORT:-10000}
      - ENVOY_HTTPS_PORT=${ENVOY_HTTPS_PORT:-10443}
      - ROUTES_CSV=/etc/envoy-cp/routes/routes.csv
      - SSL_DIR=/etc/envoy-cp/ssl
      - DEFAULT_SITE_DIR=/etc/envoy-cp/default-site
      - EXT_AUTHZ_MAX_BODY_BYTES=${EXT_AUTHZ_MAX_BODY_BYTES:-8192}
      - EXT_AUTHZ_TIMEOUT_MS=${EXT_AUTHZ_TIMEOUT_MS:-200}
      - UPSTREAM_CONNECT_TIMEOUT_MS=${UPSTREAM_CONNECT_TIMEOUT_MS:-1000}
      - REQUEST_TIMEOUT_S=${REQUEST_TIMEOUT_S:-15}
      - STREAM_IDLE_TIMEOUT_S=${STREAM_IDLE_TIMEOUT_S:-300}
      - ACME_HTTP01_PORT=${ACME_HTTP01_PORT:-80}
    volumes:
      # Directory mounts, not single-file mounts: a single-file bind mount is
      # bound to that file's inode, and an edit that replaces the file (write
      # to a temp file + rename over the original — common for editors and
      # some file-write tools) leaves the mount pointing at nothing. A
      # directory mount reflects live host directory contents instead.
      - ./envoy-control-plane/routes:/etc/envoy-cp/routes:ro
      # Read-write from letsencrypt-sidecar's side (a separate mount of
      # this same host path, see that service below) — this side stays
      # read-only, envoy-control-plane only ever reads certs, never writes.
      - ./${SSL_DIR:-envoy/ssl}:/etc/envoy-cp/ssl:ro
      # No separate default-site container: envoy-control-plane reads this
      # directly and answers unmatched domains with a DirectResponseAction
      # (see buildRouteConfig) — no upstream, no nginx, no version-leak
      # surface to worry about.
      - ./envoy/default-site:/etc/envoy-cp/default-site:ro
    expose:
      - "18000"
      - "18001"
    depends_on:
      # required: false — letsencrypt-sidecar is a separate opt-in profile
      # (see that service below); envoy-control-plane must still start
      # fine without it for everyone not using the feature.
      letsencrypt-sidecar:
        condition: service_started
        required: false

  # Opt-in: issues/renews real Let's Encrypt certificates for any
  # routes.csv row with letsencrypt=true, dropping them into the same
  # envoy/ssl/ directory envoy-control-plane already hot-reloads from —
  # see letsencrypt-sidecar/README (real issuance needs a real, owned,
  # publicly-resolvable domain with port 80 reachable from the internet;
  # this repo's own *.example.com domains can never actually succeed).
  letsencrypt-sidecar:
    profiles: ["letsencrypt"]
    build: ./letsencrypt-sidecar
    environment:
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      # Staging by default — production Let's Encrypt has real, low rate
      # limits; staging is the safe default the same way AUDIT_MODE
      # defaults safe elsewhere in this repo.
      - LETSENCRYPT_STAGING=${LETSENCRYPT_STAGING:-true}
      - SSL_DIR=/etc/envoy-cp/ssl
      - ROUTES_CSV=/etc/envoy-cp/routes/routes.csv
      - ACCOUNT_DIR=/lego
      - CHALLENGE_ADDR=:8090
      - ACME_RENEW_DAYS_BEFORE=${ACME_RENEW_DAYS_BEFORE:-30}
      - ACME_CHECK_INTERVAL_H=${ACME_CHECK_INTERVAL_H:-12}
    volumes:
      - ./envoy-control-plane/routes:/etc/envoy-cp/routes:ro
      # Read-write — this is the side that actually issues/renews and
      # writes cert+key+expiry+status files.
      - ./${SSL_DIR:-envoy/ssl}:/etc/envoy-cp/ssl
      # Persistent ACME account key — never bind-mounted into the repo,
      # same treatment as crowdsec-data/ollama-data/claude-shim-creds.
      - letsencrypt-data:/lego
    expose:
      - "8090"

  # Opt-in, off by default (COMPOSE_PROFILES) — enriches the dashboard's
  # attack globe with real (approximate) IP locations instead of the
  # deterministic hash-based placeholder. Requires a free MaxMind account +
  # license key (see geoip-service/main.go's doc comment); get your
  # organization's sign-off for the third-party account before setting
  # these for real, same class of prerequisite as letsencrypt-sidecar
  # needing a real, owned domain.
  geoip-service:
    profiles: ["geoip"]
    build: ./geoip-service
    environment:
      - GEOIP_ACCOUNT_ID=${GEOIP_ACCOUNT_ID:-}
      - GEOIP_LICENSE_KEY=${GEOIP_LICENSE_KEY:-}
      - GEOIP_EDITION=${GEOIP_EDITION:-GeoLite2-City}
      - GEOIP_DB_PATH=/data/GeoLite2-City.mmdb
      - GEOIP_REFRESH_INTERVAL_H=${GEOIP_REFRESH_INTERVAL_H:-24}
      - GEOIP_LISTEN_ADDR=:8092
    volumes:
      # Persistent — same reasoning as letsencrypt-data: the downloaded
      # database survives restarts instead of re-fetching on every one.
      - geoip-data:/data
    expose:
      - "8092"

  scoring-service:
    build: ./scoring-service-go
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CORAZA_URL=http://coraza-service:8003/check
      - RISK_THRESHOLD=${RISK_THRESHOLD:-0.8}
      - AUDIT_MODE=${AUDIT_MODE:-false}
      - ENABLE_CORAZA=${ENABLE_CORAZA:-true}
      - ENABLE_AI_TUNER=${ENABLE_AI_TUNER:-true}
      - AI_TUNER_MIN_SEVERITY_CODE=${AI_TUNER_MIN_SEVERITY_CODE:-3}
      - AI_TUNER_INELIGIBLE_TAGS=${AI_TUNER_INELIGIBLE_TAGS:-attack-sqli,attack-xss,attack-rce,attack-lfi,attack-rfi,attack-php-injection,attack-nodejs-injection,attack-session-fixation,attack-reputation-scanner,attack-disclosure,attack-injection-generic}
      - ENABLE_CROWDSEC=${ENABLE_CROWDSEC:-true}
      - CROWDSEC_URL=http://crowdsec:8080
      - CROWDSEC_API_KEY=${CROWDSEC_BOUNCER_KEY:-devbouncerkeychangeme}
      - CROWDSEC_POLL_INTERVAL=${CROWDSEC_POLL_INTERVAL:-10}
      # Off by default — see geoip-service's profile note below. Cosmetic
      # enrichment only (dashboard globe), never a scoring input.
      - ENABLE_GEOIP=${ENABLE_GEOIP:-false}
      - GEOIP_URL=http://geoip-service:8092/lookup
      - GEOIP_HEALTH_URL=http://geoip-service:8092/health
    volumes:
      - ./crowdsec/feed:/var/log/crowdsec-feed
    expose:
      - "8001"
      - "9001"
    depends_on:
      redis:
        condition: service_started
      # required: false — coraza-service/crowdsec/geoip-service are all
      # profile-gated (see COMPOSE_PROFILES in .env) and may not be running
      # at all. main.go already handles any of them being unreachable the
      # same way it handles ENABLE_CORAZA/ENABLE_CROWDSEC/ENABLE_GEOIP=false:
      # skip that signal, fall back to the rest. Without required:false,
      # compose refuses to start this service at all when a profile is
      # disabled.
      coraza-service:
        condition: service_started
        required: false
      crowdsec:
        condition: service_started
        required: false
      geoip-service:
        condition: service_started
        required: false

  coraza-service:
    profiles: ["coraza"]
    build: ./coraza-service
    environment:
      - CRS_VERSION=${CRS_VERSION:-4.29.0}
      - CRS_PARANOIA_LEVEL=${CRS_PARANOIA_LEVEL:-1}
    volumes:
      # Read-write: coraza-service fetches CRS into this directory itself on
      # startup (see crs_fetch.go) if it's missing or a different version
      # than CRS_VERSION — no more manual fetch-crs.sh step.
      - ./coraza-service/crs:/etc/coraza
      # Separate from crs/ on purpose — that dir gets wiped and refetched on
      # every version change, these persist. Edits here hot-reload, no
      # restart needed. Read-only for coraza-service itself; crs-tuner
      # mounts crs-exclusions read-write separately (it writes
      # auto-<domain>.conf files here) — same host path, two containers.
      - ./coraza-service/crs-extra:/etc/coraza-extra:ro
      - ./coraza-service/crs-exclusions:/etc/coraza-exclusions:ro
    expose:
      - "8003"

  crowdsec:
    profiles: ["crowdsec"]
    image: crowdsecurity/crowdsec:latest
    environment:
      # nginx: repeated-403/bad-behavior scenarios off the generic access log.
      # modsecurity: crowdsecurity/modsecurity, fires immediately off a single
      # CRITICAL-severity CRS match instead of waiting for a pattern — see
      # scoring-service/app/crowdsec_client.py's log_modsec_matches_for_crowdsec.
      - COLLECTIONS=crowdsecurity/nginx crowdsecurity/modsecurity
      # Local-only by design for this demo: no phoning home to CrowdSec's
      # cloud / community blocklist unless you opt in.
      - DISABLE_ONLINE_API=true
      - BOUNCER_KEY_scoring=${CROWDSEC_BOUNCER_KEY:-devbouncerkeychangeme}
    volumes:
      # Bind mounts to pre-existing host files (see crowdsec/feed/), not a
      # named volume: CrowdSec's file datasource only globs for matches once
      # at startup and never retries, so both files must already exist
      # before the container starts — a named volume would still be empty at
      # that point if scoring-service hadn't written to them yet.
      - ./crowdsec/feed:/var/log/crowdsec-feed:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec-data:/var/lib/crowdsec/data
    expose:
      - "8080"

  # Only needed for the local (default) model — not started at all if
  # OLLAMA_URL in .env points at a remote/external Ollama instead. Separate
  # profile from crs-tuner's own (ai-tuner) for exactly that reason: enabling
  # the AI tuner doesn't have to mean running a local model.
  ollama:
    profiles: ["ollama-local"]
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    # Official image doesn't auto-pull a model — start the server, pull the
    # configured one (idempotent: a no-op if already cached in the volume
    # from a previous run), then wait on the server so it stays the
    # container's foreground process.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama serve &
        sleep 2 &&
        ollama pull ${AI_TUNER_MODEL:-llama3:8b} &&
        wait

  # Alternative to ollama/ollama-local above — an Ollama-API-compatible shim
  # backed by `claude -p` (Claude Code's non-interactive mode) instead of a
  # locally-run model, for using an existing Claude subscription's included
  # usage instead of a GPU or metered API billing. Mutually exclusive with
  # ollama-local in practice: point OLLAMA_URL at whichever one you're
  # running, don't run both. Needs claude-shim/setup-credentials.sh run
  # first (populates the claude-shim-creds volume — never a live mount of
  # your real ~/.claude, see that script's own comments for why) and
  # AI_TUNER_MODEL set to a real Claude model alias (e.g. "haiku", "sonnet"),
  # not an Ollama tag. See claude-shim/README.md for real cost/latency
  # numbers measured against this repo — it is NOT free, your account's
  # usage is metered the same as interactive use, just not by a separate
  # API key.
  claude-shim:
    profiles: ["claude-shim"]
    build: ./claude-shim
    environment:
      - DEFAULT_MODEL=${AI_TUNER_MODEL:-haiku}
    volumes:
      # Isolated copy, not a live bind-mount of ~/.claude — see
      # setup-credentials.sh. Read-write: claude -p needs to persist
      # refreshed OAuth tokens as they rotate, but only ever to this
      # isolated volume, never back to the host's real credentials.
      - claude-shim-creds:/root/.claude
    expose:
      - "11434"

  # Async, off the request path entirely: analyzes CRS matches (queued by
  # scoring-service via a Redis Stream) with a local LLM, judging
  # true/false-positive, and auto-generates a narrowly-scoped exclusion once
  # the *same* (domain, rule, variable) is independently judged a false
  # positive AI_TUNER_FP_THRESHOLD times — see crs-tuner/app/main.py.
  crs-tuner:
    profiles: ["ai-tuner"]
    build: ./crs-tuner
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Local by default (the bundled ollama service above) — point this at
      # a remote/external Ollama-compatible endpoint instead if you don't
      # want to run a model in this stack at all. Doesn't imply anything
      # about the ollama-local profile — that's a separate opt-in.
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      # Only used against a remote/hosted Ollama endpoint behind auth — see
      # .env. Empty by default, no Authorization header sent.
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - ENABLE_AI_TUNER=${ENABLE_AI_TUNER:-true}
      - AI_TUNER_MODEL=${AI_TUNER_MODEL:-llama3:8b}
      - AI_TUNER_FP_THRESHOLD=${AI_TUNER_FP_THRESHOLD:-3}
      - AI_TUNER_CONFIDENCE_MIN=${AI_TUNER_CONFIDENCE_MIN:-0.7}
      - EXCLUSIONS_DIR=/etc/coraza-exclusions
    volumes:
      # Read-write here — crs-tuner writes auto-<domain>.conf files into
      # this same host path coraza-service mounts read-only.
      - ./coraza-service/crs-exclusions:/etc/coraza-exclusions
      # Bind mount, not a named volume: the audit trail (verdicts + the
      # dedicated error log) is meant to be human-inspectable on the host,
      # not hidden inside Docker's volume storage.
      - ./crs-tuner/analysis:/var/lib/crs-tuner/analysis
    depends_on:
      redis:
        condition: service_started
      # required: false — ollama is a separate profile (ollama-local); if
      # OLLAMA_URL points at a remote instance instead, that container never
      # starts at all, and compose must not refuse to start crs-tuner over it.
      ollama:
        condition: service_started
        required: false
      # Same reasoning — a separate opt-in profile (claude-shim above),
      # not started if OLLAMA_URL points somewhere else entirely.
      claude-shim:
        condition: service_started
        required: false

  backend:
    image: mendhak/http-https-echo:31
    expose:
      - "8080"
      - "8443"
    environment:
      - HTTP_PORT=8080
      # routes.csv-driven targets are always connected to over HTTPS (that's
      # what makes each row's cert_check flag meaningful) — this image
      # generates its own self-signed cert automatically for this port.
      - HTTPS_PORT=8443

  # A second, identical backend — for testing multi-backend routing (the
  # dashboard's topology diagram, per-backend charts) rather than any real
  # functional difference from `backend` above. routes.csv points a few
  # domains at this one instead, so there's an actual second distinct
  # target:port to render/exercise.
  backend2:
    image: mendhak/http-https-echo:31
    expose:
      - "8080"
      - "8443"
    environment:
      - HTTP_PORT=8080
      - HTTPS_PORT=8443

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  dashboard:
    build: ./dashboard
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Same source (.env) as scoring-service — shown as a read-only banner,
      # never changes scoring-service's actual behavior from here.
      - RISK_THRESHOLD=${RISK_THRESHOLD:-0.8}
      - AUDIT_MODE=${AUDIT_MODE:-false}
      - ENABLE_CORAZA=${ENABLE_CORAZA:-true}
      - ENABLE_CROWDSEC=${ENABLE_CROWDSEC:-true}
      - ENABLE_AI_TUNER=${ENABLE_AI_TUNER:-true}
      - ENABLE_GEOIP=${ENABLE_GEOIP:-false}
      # For the live ai-tuner/ollama connectivity check — same source as
      # crs-tuner's own OLLAMA_URL/OLLAMA_API_KEY. The key is only ever used
      # server-side for that check, never sent to the browser — only whether
      # it's set at all is exposed (ollama_auth_configured).
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      # App-level allowlist (belt-and-suspenders on top of DASHBOARD_BIND_ADDR
      # below) — matters once that bind is opened beyond loopback.
      - DASHBOARD_BIND_ADDR=${DASHBOARD_BIND_ADDR:-127.0.0.1}
      - DASHBOARD_ALLOWED_IPS=${DASHBOARD_ALLOWED_IPS:-}
      - CONTROL_PLANE_URL=http://envoy-control-plane:18001
    volumes:
      # Directory mount, not individual files: coraza-service now fetches CRS
      # on its own first startup, so VERSION/FETCHED_AT may not exist yet on
      # a fresh checkout — a file-level bind mount would fail or (worse)
      # Docker would silently create an empty directory in their place. A
      # directory mount tolerates missing files fine (read code already
      # handles that gracefully).
      - ./coraza-service/crs:/crs:ro
      # Read-only — for the generated-exclusions rules page/chart
      # (_generated-exclusions.jsonl, written by crs-tuner's
      # exclusion_writer.py). Same directory crs-tuner itself writes to,
      # mounted separately here so the dashboard never needs write access.
      - ./crs-tuner/analysis:/analysis:ro
    ports:
      # Bound to 127.0.0.1 by default — the dashboard has no auth of its own,
      # so it shouldn't be reachable off-host unless explicitly opened via
      # DASHBOARD_BIND_ADDR=0.0.0.0 (then use DASHBOARD_ALLOWED_IPS too).
      - "${DASHBOARD_BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-8002}:8002"
    depends_on:
      - redis

  # On-demand only — never starts with `docker compose up`.
  # Run: docker compose run --rm loadtest
  loadtest:
    image: grafana/k6:latest
    profiles: ["tools"]
    volumes:
      - ./tests/loadtest:/scripts:ro
      - ./tests/loadtest/results:/results
      - ./coraza-service/crs:/crs:ro
    environment:
      - BASE_URL=http://envoy:${ENVOY_HTTP_PORT:-10000}
    entrypoint: ["k6", "run", "/scripts/smoke.js"]
    depends_on:
      - envoy

volumes:
  crowdsec-data:
  ollama-data:
  letsencrypt-data:
  geoip-data:
  # Created by claude-shim/setup-credentials.sh, not by compose (external:
  # true) — compose defaults to project-prefixing volume names (would
  # otherwise be "envoy_claude-shim-creds"), which that script has no way
  # to know in advance. Run setup-credentials.sh before starting the
  # claude-shim profile, or this volume won't exist yet.
  claude-shim-creds:
    external: true
